name: Scan (L1 ingest + L2 classify)
# Polls the sources, maps items to tickers, dedups, classifies, scores N, and writes JSON to gh-pages.
# Started every 10 min by an external cron (workflow_dispatch); GitHub's own cron below is only a
# backup, because it delivers ~5% of frequent schedules on this account (PLAN §18).
# gh-pages is one rolling commit. Files written by nightly.yml are always taken from the published copy.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 3-10 * * 1-5"    # every 10 min, 08:30–16:30 IST (India session)
    - cron: "*/10 13-21 * * 1-5"   # every 10 min, 18:30–03:30 IST (US session)
    - cron: "15,25 18 * * *"       # 23:45 / 23:55 IST: last BSE poll before its midnight reset
    - cron: "5 * * * *"            # hourly otherwise, weekends included
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: write
  actions: write                   # to start nightly.yml when it is due
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load store from gh-pages
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store \
            || mkdir -p store
          rm -rf store/.git
      - name: Scan
        id: scan
        env:
          SEC_UA_EMAIL: ${{ secrets.SEC_UA_EMAIL }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}        # optional; rules-only without it
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}       # optional repo variable; default gemini-flash-lite-latest
          TG_TOKEN: ${{ secrets.TG_TOKEN }}            # Telegram bot; dry run without it
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}            # comma list, e.g. "HDFCBANK, TCS.NS, AAPL"; never published
          WATCHLIST: ${{ secrets.WATCHLIST }}
        run: python scan.py --store store
      - name: Stats in the run summary
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;d=json.load(open('store/data/stats.json'));d.pop('per_source');print(json.dumps(d,indent=1))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish store to gh-pages
        run: bash publish.sh store "scan $(date -u +%Y-%m-%dT%H:%MZ)" keep-nightly
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      - name: Start nightly scores if due
        if: steps.scan.outputs.nightly_due == 'true'
        run: gh workflow run nightly.yml --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
